services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: koinonia
      POSTGRES_USER: koinonia
      POSTGRES_PASSWORD: koinonia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koinonia -d koinonia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
